spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workshop_api?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:gabriel}
spring.datasource.password=${DB_password:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.show-extensions=true
springdoc.writer-with-default-pretty-printer=true

spring.main.allow-bean-definition-overriding=true

