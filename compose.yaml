version: '4.84.0'

services:
  mysql:
    image: 'mysql:8.4'
    container_name: workShop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: workShop_api
      MYSQL_USER: gabriel
      MYSQL_PASSWORD: admin
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-networks

  web-app:
    build: .
    container_name: workShop_app
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - mysql
    networks:
      - app-networks

volumes:
  mysql_data: {}

networks:
  app-networks:
    driver: bridge